[project]
name = "cargotrack-api"
version = "1.0.0"
description = "Real-time ocean container tracking API - carrier data engine, webhooks, usage-based billing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "browserforge>=1.2.4",
    "camoufox>=0.4.11",
    "curl-cffi>=0.15.0",
    "fastapi>=0.138.1",
    "lxml>=6.1.1",
    "msgspec>=0.21.1",
    "patchright>=1.60.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scrapling>=0.4.9",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    # --- production backend additions ---
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.1.0",
    "authlib>=1.3.2",
    "httpx>=0.27.2",
    "stripe>=11.3.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "email-validator>=2.2.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_api.py/test_browser_headers_comparison.py/test_own_ip.py are manual
# smoke/benchmark scripts against a *running* server (see their own
# docstrings) - not pytest suites, despite the test_-prefixed names. They
# predate this project's real test suite and are kept for manual/CLI use,
# not collected here (test_browser_headers_comparison.py's functions take
# required positional args pytest can't supply, which errors at collection).
addopts = "--ignore=tests/test_api.py --ignore=tests/test_browser_headers_comparison.py --ignore=tests/test_own_ip.py"


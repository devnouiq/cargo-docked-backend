# Cloud Build CI/CD pipeline: build once, deploy to both the API service
# and the arq worker pool. Triggered on push to `main` via a Cloud Build
# GitHub trigger (see deploy notes in CLAUDE.md / README.md).
#
# Both Cloud Run resources share the exact same image - the worker pool
# just overrides the container's entrypoint from the Dockerfile's default
# `uvicorn` command to the arq worker loop. Only the API service runs
# `alembic upgrade head` (via the Dockerfile's CMD) - fine for a single
# instance; a multi-replica rollout should move migrations to their own
# release step instead of letting every replica race to migrate on boot.
#
# NOTE: FRONTEND_BASE_URL / CORS_ALLOW_ORIGINS below are placeholders
# (https://cargotrack.vercel.app) until the real Vercel domain exists -
# update both `--set-env-vars` blocks once it's known, then re-run the
# trigger (or `gcloud run services update cargotrack-api --update-env-vars=...`
# for a one-off fix without a full rebuild).

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cargotrack-api
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:cargotrack-db'
      - '--network=default'
      - '--vpc-egress=private-ranges-only'
      - '--set-env-vars=ENV=production,LOG_LEVEL=INFO,OAUTH_REDIRECT_BASE_URL=https://cargotrack-api-34343163556.us-central1.run.app,FRONTEND_BASE_URL=https://cargotrack.vercel.app,CORS_ALLOW_ORIGINS=["https://cargotrack.vercel.app"],GOOGLE_CLIENT_ID=34343163556-mf0ud0lhvgsi0limqu5el8hlhg37lm71.apps.googleusercontent.com,OXYLABS_PROXY_HOST=pr.oxylabs.io:7777,OXYLABS_PROXY_USERNAME=customer-DataDocked2026_KmjsA'
      - >-
        --set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,
        JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,
        STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,
        OXYLABS_PROXY_PASSWORD=oxylabs-proxy-password:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - worker-pools
      - deploy
      - cargotrack-worker
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:$SHORT_SHA'
      - '--region=us-central1'
      - '--command=arq'
      - '--args=app.workers.arq_app.WorkerSettings'
      - '--instances=1'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:cargotrack-db'
      - '--network=default'
      - '--vpc-egress=private-ranges-only'
      - '--set-env-vars=ENV=production,LOG_LEVEL=INFO,OXYLABS_PROXY_HOST=pr.oxylabs.io:7777,OXYLABS_PROXY_USERNAME=customer-DataDocked2026_KmjsA'
      - >-
        --set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,
        JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,
        OXYLABS_PROXY_PASSWORD=oxylabs-proxy-password:latest

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cargotrack/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
